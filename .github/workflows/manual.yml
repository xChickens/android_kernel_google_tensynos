name: Manual Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Kernel branch to build
        type: choice
        required: true
        options:
          - 17.0.0-cp41.007

      target:
        description: Device target
        type: choice
        required: true
        default: all
        options:
          - zumapro

      variant:
        description: Kernel variant
        type: choice
        required: true
        default: all
        options:
          - all
          - ksu-susfs
          - ksu-next-susfs

jobs:
  matrix:
    name: Generate build matrix
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Generate matrix
        id: matrix
        shell: bash
        run: |
          set -Eeuo pipefail

          TARGET="${{ github.event.inputs.target }}"
          VARIANT="${{ github.event.inputs.variant }}"

          if [[ "$TARGET" == "all" ]]; then
              TARGETS=(zumapro)
          else
              TARGETS=("$TARGET")
          fi

          if [[ "$VARIANT" == "all" ]]; then
              VARIANTS=(
                  ksu-susfs
                  ksu-next-susfs
              )
          else
              VARIANTS=("$VARIANT")
          fi

          JSON='{"include":['
          FIRST=true

          for TARGET in "${TARGETS[@]}"; do
              for VARIANT in "${VARIANTS[@]}"; do

                  if $FIRST; then
                      FIRST=false
                  else
                      JSON+=","
                  fi

                  JSON+="{\"target\":\"${TARGET}\",\"variant\":\"${VARIANT}\"}"

              done
          done

          JSON+="]}"

          echo "$JSON"

          {
              echo "matrix<<EOF"
              echo "$JSON"
              echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build

    needs: matrix

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}

    uses: ./.github/workflows/build.yml

    with:
      target: ${{ matrix.target }}
      variant: ${{ matrix.variant }}
      branch: ${{ inputs.branch }}

    secrets: inherit
